<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15252d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="format-detection" content="telephone=yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Fira+Code:wght@500&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Default head tags. react-helmet-async replaces these per route (data-rh marks them as managed). -->
    <title data-rh="true">Metro Dental BD: Dental Implant and Braces, Bangshal, Dhaka</title>
    <meta
      data-rh="true"
      name="description"
      content="Dental implants, braces care, and family dental treatment with Dr. Mustak in Bangshal, Dhaka. Call 01716374977 to book."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Metro Dental BD" />
    <meta
      data-rh="true"
      property="og:title"
      content="Metro Dental BD: Dental Implant and Braces, Bangshal, Dhaka"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Dental implants, braces care, and family dental treatment with Dr. Mustak in Bangshal, Dhaka."
    />
    <meta data-rh="true" property="og:image" content="/images/og-cover.png" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="Metro Dental BD: Dental Implant and Braces, Bangshal, Dhaka"
    />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Dental implants, braces care, and family dental treatment with Dr. Mustak in Bangshal, Dhaka."
    />
    <meta data-rh="true" name="twitter:image" content="/images/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
